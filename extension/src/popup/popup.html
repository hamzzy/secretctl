<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>secretctl</title>
  <style>
    /* Quiet system utility, not a dashboard. The extension is an execution
       surface; the Tauri app is the human control plane (spec §26, §32). */
    :root {
      --bg: #ffffff;
      --bg-sunken: #f2f2f4;
      --border: rgba(0, 0, 0, 0.1);
      --text: #1c1c1e;
      --text-secondary: #6b6b70;
      --text-tertiary: #93939a;
      --positive: #1a7f37;
      --attention: #9a6700;
      --negative: #b3261e;
      --accent: #0a6cff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1e;
        --bg-sunken: #262629;
        --border: rgba(255, 255, 255, 0.1);
        --text: #f2f2f5;
        --text-secondary: #a0a0a8;
        --text-tertiary: #75757d;
        --positive: #57c66d;
        --attention: #e3b341;
        --negative: #ff7b72;
        --accent: #5aa0ff;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      width: 260px;
      margin: 0;
      padding: 12px 14px 14px;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      line-height: 18px;
    }

    .header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .wordmark { font-weight: 600; font-size: 15px; }

    .state { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; }

    .divider { border-top: 1px solid var(--border); margin: 10px -14px; }

    .label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-tertiary);
    }

    .value { margin-top: 2px; word-break: break-all; }

    .muted { color: var(--text-secondary); }

    .site { font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: 12px; }

    ul { margin: 4px 0 0; padding: 0; list-style: none; }
    li { font-size: 12px; }

    .note {
      margin-top: 10px;
      padding: 8px 10px;
      margin-left: -4px;
      margin-right: -4px;
      border-radius: 6px;
      background: var(--bg-sunken);
      font-size: 12px;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="wordmark">secretctl</span>
    <span class="state" id="connection">
      <span aria-hidden="true" id="connectionGlyph">·</span>
      <span id="connectionLabel">Checking…</span>
    </span>
  </div>

  <div id="body"></div>

  <script src="popup.js"></script>
</body>
</html>
