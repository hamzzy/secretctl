<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>secretctl Enforcement</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 280px;
      padding: 16px;
      margin: 0;
      background: #111;
      color: #eee;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .badge {
      background: #10b981;
      color: #000;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .title {
      font-weight: 600;
      font-size: 14px;
    }
    .status-box {
      background: #222;
      border-radius: 6px;
      padding: 10px;
      font-size: 12px;
      border: 1px solid #333;
      margin-bottom: 12px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .label {
      color: #888;
    }
    .value {
      font-family: monospace;
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="title">secretctl</span>
    <span class="badge" id="statusBadge">Active</span>
  </div>
  <div class="status-box">
    <div class="row">
      <span class="label">Assurance</span>
      <span class="value">Managed</span>
    </div>
    <div class="row">
      <span class="label">Native Host</span>
      <span class="value" id="hostStatus">Connected</span>
    </div>
    <div class="row">
      <span class="label">Epoch</span>
      <span class="value" id="epochVal">1</span>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
