[workspace]
resolver = "2"
members = [
    "crates/secretctl-domain",
    "crates/secretctl-protocol",
    "crates/secretctl-crypto",
    "crates/secretctl-policy",
    "crates/secretctl-capability",
    "crates/secretctl-providers",
    "crates/secretctl-provider-macos",
    "crates/secretctl-provider-windows",
    "crates/secretctl-provider-linux",
    "crates/secretctl-audit",
    "crates/secretctl-store",
    "crates/secretctl-browser-gateway",
    "crates/secretctl-native-host",
    "crates/secretctl-cli",
    "crates/secretctld",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["secretctl contributors"]
license = "Apache-2.0"
repository = "https://github.com/hamzzy/secretctl"

[workspace.dependencies]
# Internal workspace crates
secretctl-domain = { path = "crates/secretctl-domain" }
secretctl-protocol = { path = "crates/secretctl-protocol" }
secretctl-crypto = { path = "crates/secretctl-crypto" }
secretctl-policy = { path = "crates/secretctl-policy" }
secretctl-capability = { path = "crates/secretctl-capability" }
secretctl-providers = { path = "crates/secretctl-providers" }
secretctl-provider-macos = { path = "crates/secretctl-provider-macos" }
secretctl-provider-windows = { path = "crates/secretctl-provider-windows" }
secretctl-provider-linux = { path = "crates/secretctl-provider-linux" }
secretctl-audit = { path = "crates/secretctl-audit" }
secretctl-store = { path = "crates/secretctl-store" }
secretctl-browser-gateway = { path = "crates/secretctl-browser-gateway" }

# Platform & Keychain
security-framework = "3.2"
keyring = { version = "3.6", default-features = false }

# Serialization & Data Formats
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = "0.9"
minicbor = { version = "0.26", features = ["derive", "std"] }
command-fds = "0.3"
os_pipe = "1.2"

# Asynchronous Runtime & Networking
tokio = { version = "1.43", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1.10"
futures = "0.3"

# Cryptography & Security
zeroize = { version = "1.8", features = ["derive", "zeroize_derive"] }
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }
x25519-dalek = { version = "2.0", features = ["static_secrets", "serde"] }
chacha20poly1305 = { version = "0.10", features = ["alloc"] }
hkdf = "0.12"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2.6"
rand = "0.8"
rand_core = { version = "0.6", features = ["std"] }
base64 = "0.22"

# Time & Identifiers
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.13", features = ["v4", "v7", "serde"] }
url = { version = "2.5", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Database
rusqlite = { version = "0.33", features = ["bundled", "chrono", "uuid", "blob", "backup"] }

# CLI & Utilities
clap = { version = "4.5", features = ["derive", "env"] }
rpassword = "7.3"
thiserror = "2.0"
anyhow = "1.0"
aes-gcm = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
async-trait = "0.1"

# Testing & Property Checks
proptest = "1.6"
tempfile = "3.17"
